<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMY</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
overflow:hidden;
background:radial-gradient(circle at top,#0f172a,#020617 70%);
touch-action:none;
}
canvas{
display:block;
image-rendering:auto;
}
#hud{
position:fixed;
top:15px;
left:15px;
padding:15px;
background:rgba(0,0,0,.45);
color:white;
border-radius:15px;
backdrop-filter:blur(5px);
z-index:50;
}
#leaderboard{
position:fixed;
top:15px;
right:15px;
padding:15px;
background:rgba(0,0,0,.45);
color:white;
border-radius:15px;
width:220px;
z-index:50;
}
#map{
position:fixed;
bottom:20px;
right:20px;
background:rgba(0,0,0,.4);
border-radius:12px;
z-index:50;
}
#joystickBase{
position:fixed;
left:30px;
bottom:30px;
width:140px;
height:140px;
border-radius:50%;
background:rgba(255,255,255,.08);
border:2px solid rgba(255,255,255,.2);
z-index:100;
}
#joystick{
position:absolute;
left:40px;
top:40px;
width:60px;
height:60px;
border-radius:50%;
background:rgba(255,255,255,.45);
}
#gameOver{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
background:rgba(0,0,0,.85);
color:white;
z-index:999;
}
button{
padding:12px 25px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-size:18px;
margin-top:15px;
cursor:pointer;
}
</style>
</head>
<body>
<div id="hud">
<div>⭐ Score: <span id="score">0</span></div>
<div>🐍 Size: <span id="size">20</span></div>
<div>❤️ Lives: <span id="lives">3</span></div>
<div>🏅 Level: <span id="level">1</span></div>
<div>🔥 Combo: <span id="combo">0</span></div>
<div>⚡ Boost: SPACE</div>
<div>💨 Dash: SHIFT</div>
</div>
<div id="leaderboard">
<h3>🏆 Ranking</h3>
<div id="board"></div>
</div>
<canvas id="map" width="220" height="220"></canvas>
<div id="joystickBase">
<div id="joystick"></div>
</div>
<div id="gameOver">
<h1>💀 GAME OVER</h1>
<p>Tu serpiente fue destruida</p>
<button onclick="location.reload()">Reiniciar</button>
</div>

<button id="pauseBtn" style="position:fixed;top:15px;left:260px;z-index:1000;padding:10px 15px;">⏸ Pausa</button>
<button id="musicBtn" style="position:fixed;top:15px;left:380px;z-index:1000;padding:10px 15px;">🔊 Música</button>
<audio id="eatSound" preload="auto">
<source src="https://actions.google.com/sounds/v1/cartoon/pop.ogg" type="audio/ogg">
</audio>
<audio id="bgMusic" autoplay loop>
<source src="https://actions.google.com/sounds/v1/ambiences/bird_forest_ambience.ogg" type="audio/ogg">
</audio>

<canvas id="game"></canvas>
<script>

alert("Bienvenido a AMY");

let gamePaused=false;

document.getElementById("pauseBtn").onclick=()=>{
 gamePaused=!gamePaused;
 document.getElementById("pauseBtn").textContent=gamePaused?"▶ Reanudar":"⏸ Pausa";
};

const bgMusic=document.getElementById("bgMusic");
document.getElementById("musicBtn").onclick=()=>{
 if(bgMusic.paused){
   bgMusic.play();
   document.getElementById("musicBtn").textContent="🔊 Música";
 }else{
   bgMusic.pause();
   document.getElementById("musicBtn").textContent="🔇 Silencio";
 }
};

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=true;
const map=document.getElementById("map");
const mtx=map.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;
const world={
width:8000,
height:8000
};
let score=0;
let zoom=1;
let lives=3;
let level=1;
let combo=0;
let comboTimer=0;
let invulnerable=false;
let shake=0;
let boostDrain;
const particles=[];
const foods=[];
const enemies=[];
const meteors=[];
const stars={
far:[],
mid:[],
near:[]
};
function rand(min,max){
return Math.random()*(max-min)+min;
}
function randomColor(){
return `hsl(${Math.random()*360},100%,60%)`;
}
for(let i=0;i<300;i++){
stars.far.push({
x:Math.random()*world.width,
y:Math.random()*world.height,
s:1
});
}
for(let i=0;i<200;i++){
stars.mid.push({
x:Math.random()*world.width,
y:Math.random()*world.height,
s:2
});
}
for(let i=0;i<120;i++){
stars.near.push({
x:Math.random()*world.width,
y:Math.random()*world.height,
s:3
});
}
const skins=[
"#22c55e",
"#3b82f6",
"#ef4444",
"#eab308",
"#a855f7",
"#ec4899",
"#14b8a6"
];
const player={
x:world.width/2,
y:world.height/2,
size:20,
speed:4,
angle:0,
color:skins[Math.floor(Math.random()*skins.length)],
body:[]
};
function createFood(amount=1500){
for(let i=0;i<amount;i++){
const value=[10,20,30,40,50][Math.floor(Math.random()*5)];
foods.push({
x:rand(0,world.width),
y:rand(0,world.height),
r:4+value/8,
glow:10+value/2,
points:value,
growth:value/800,
pulse:0,
color:randomColor()
});
}
}
function createEnemy(){
let e={
x:rand(0,world.width),
y:rand(0,world.height),
size:rand(20,45),
speed:rand(1.8,3),
angle:Math.random()*Math.PI*2,
color:randomColor(),
name:"BOT-"+Math.floor(rand(100,999)),
body:[]
};
for(let i=0;i<90;i++){
e.body.push({
x:e.x-i*8,
y:e.y
});
}
enemies.push(e);
}
createFood();
for(let i=0;i<45;i++){
createEnemy();
}
enemies[0].size=120;
enemies[0].speed=1;
enemies[0].name="☠ TITAN";
function spawnParticles(x,y,color,count=10){
for(let i=0;i<count;i++){
particles.push({
x,
y,
vx:rand(-3,3),
vy:rand(-3,3),
life:40,
color
});
}
}
function movePlayer(){
player.x += Math.cos(player.angle)*player.speed;
player.y += Math.sin(player.angle)*player.speed;
player.x=Math.max(0,Math.min(world.width,player.x));
player.y=Math.max(0,Math.min(world.height,player.y));
player.body.unshift({
x:player.x,
y:player.y
});
while(player.body.length>player.size*3){
player.body.pop();
}
}
function moveEnemies(){
enemies.forEach(e=>{
let nearestFood=null;
let best=999999;
foods.forEach(f=>{
let d=Math.hypot(f.x-e.x,f.y-e.y);
if(d<best){
best=d;
nearestFood=f;
}
});
if(e.size>player.size*1.1){
e.angle=Math.atan2(
player.y-e.y,
player.x-e.x
);
}else if(nearestFood){
e.angle=Math.atan2(
nearestFood.y-e.y,
nearestFood.x-e.x
);
}else{
e.angle=Math.atan2(
e.y-player.y,
e.x-player.x
);
}
e.angle += rand(-0.04,0.04);
e.x += Math.cos(e.angle)*e.speed;
e.y += Math.sin(e.angle)*e.speed;
e.body.unshift({
x:e.x,
y:e.y
});
while(e.body.length>e.size*3){
e.body.pop();
}
});
}
function eatFood(){
for(let i=foods.length-1;i>=0;i--){
const f=foods[i];
let d=Math.hypot(player.x-f.x,player.y-f.y);
if(d<player.size){
score += f.points + combo*2; document.getElementById("eatSound").currentTime=0; document.getElementById("eatSound").play();
combo++;
comboTimer=120;
player.size += f.growth;
spawnParticles(f.x,f.y,f.color,8);
foods.splice(i,1);
foods.push({
x:rand(0,world.width),
y:rand(0,world.height),
r:f.r,
glow:f.glow,
points:f.points,
growth:f.growth,
pulse:0,
color:randomColor()
});
if(score>level*1000){
level++;
player.speed += 0.2;
}
}
}
}
function explode(){
for(let i=0;i<player.body.length;i+=6){
foods.push({
x:player.body[i].x,
y:player.body[i].y,
r:8,
glow:15,
points:20,
growth:0.05,
pulse:0,
color:player.color
});
spawnParticles(
player.body[i].x,
player.body[i].y,
player.color,
20
);
}
}
function hitEnemy(){
if(invulnerable) return;
enemies.forEach(e=>{
for(let i=10;i<e.body.length;i+=5){
const p=e.body[i];
let d=Math.hypot(player.x-p.x,player.y-p.y);
if(d<player.size){
lives--;
shake=20;
explode();
invulnerable=true;
setTimeout(()=>{
invulnerable=false;
},1500);
player.x=world.width/2;
player.y=world.height/2;
if(lives<=0){
document.getElementById("gameOver").style.display="flex";
}
break;
}
}
});
}
function enemyCollisions(){
for(let a=0;a<enemies.length;a++){
const e1=enemies[a];
let dead=false;
for(let b=0;b<enemies.length;b++){
if(a===b) continue;
const e2=enemies[b];
for(let i=10;i<e2.body.length;i+=4){
const p=e2.body[i];
let d=Math.hypot(
e1.x-p.x,
e1.y-p.y
);
if(d<e1.size*0.8){
dead=true;
break;
}
}
if(dead) break;
}
if(dead){
spawnParticles(
e1.x,
e1.y,
e1.color,
50
);
for(let i=0;i<e1.body.length;i+=3){
foods.push({
x:e1.body[i].x,
y:e1.body[i].y,
r:7,
glow:15,
points:20,
growth:0.04,
pulse:0,
color:e1.color
});
}
enemies.splice(a,1);
createEnemy();
a--;
}
}
}
function playerKillsEnemies(){
enemies.forEach((e,index)=>{
for(let i=10;i<player.body.length;i+=4){
const p=player.body[i];
let d=Math.hypot(
e.x-p.x,
e.y-p.y
);
if(d<e.size){
spawnParticles(
e.x,
e.y,
e.color,
60
);
score += Math.floor(e.size*10);
for(let j=0;j<e.body.length;j+=3){
foods.push({
x:e.body[j].x,
y:e.body[j].y,
r:8,
glow:15,
points:30,
growth:0.05,
pulse:0,
color:e.color
});
}
enemies.splice(index,1);
createEnemy();
break;
}
}
});
}
function drawGrid(){
ctx.strokeStyle="rgba(255,255,255,.03)";
for(let x=0;x<world.width;x+=120){
ctx.beginPath();
ctx.moveTo(x,0);
ctx.lineTo(x,world.height);
ctx.stroke();
}
for(let y=0;y<world.height;y+=120){
ctx.beginPath();
ctx.moveTo(0,y);
ctx.lineTo(world.width,y);
ctx.stroke();
}
}
function drawStars(layer,speed,alpha){
ctx.globalAlpha=alpha;
layer.forEach(s=>{
ctx.fillStyle="white";
ctx.fillRect(
s.x-player.x*speed,
s.y-player.y*speed,
s.s,
s.s
);
});
ctx.globalAlpha=1;
}
function drawSnake(body,size,color,angle,biggest=false){
for(let i=body.length-1;i>=0;i--){
const p=body[i];
ctx.beginPath();
ctx.fillStyle=color;
ctx.shadowColor=color;
ctx.shadowBlur=20+Math.sin(Date.now()*0.01)*10;
ctx.arc(
p.x,
p.y,
Math.max(2,size-(i*0.015)),
0,
Math.PI*2
);
ctx.fill();
}
if(biggest){
ctx.beginPath();
ctx.strokeStyle="gold";
ctx.lineWidth=5;
ctx.arc(body[0].x,body[0].y,size+15,0,Math.PI*2);
ctx.stroke();
}
const head=body[0];
if(head){
ctx.save();
ctx.translate(head.x,head.y);
ctx.rotate(angle);
ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(-7,-7,5,0,Math.PI*2);
ctx.arc(7,-7,5,0,Math.PI*2);
ctx.fill();
ctx.fillStyle="black";
ctx.beginPath();
ctx.arc(-6,-6,2,0,Math.PI*2);
ctx.arc(6,-6,2,0,Math.PI*2);
ctx.fill();
ctx.restore();
}
}
setInterval(()=>{
meteors.push({
x:rand(0,world.width),
y:-100,
vx:rand(-8,-3),
vy:rand(8,15),
life:200
});
},3000);
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
zoom += ((1-player.size/220)-zoom)*0.04;
let sx=0;
let sy=0;
if(shake>0){
sx=(Math.random()-.5)*shake;
sy=(Math.random()-.5)*shake;
shake*=0.9;
}
ctx.setTransform(
zoom,0,0,zoom,
canvas.width/2-player.x*zoom+sx,
canvas.height/2-player.y*zoom+sy
);
drawGrid();
drawStars(stars.far,0.02,.2);
drawStars(stars.mid,0.05,.4);
drawStars(stars.near,0.1,.7);
foods.forEach(f=>{
f.pulse += 0.08;
ctx.beginPath();
ctx.fillStyle=f.color;
ctx.shadowColor=f.color;
ctx.shadowBlur=f.glow + Math.sin(f.pulse)*4;
ctx.arc(
f.x,
f.y,
f.r + Math.sin(f.pulse)*0.5,
0,
Math.PI*2
);
ctx.fill();
});
particles.forEach((p,index)=>{
p.x += p.vx;
p.y += p.vy;
p.life--;
ctx.globalAlpha=p.life/40;
ctx.fillStyle=p.color;
ctx.fillRect(p.x,p.y,4,4);
ctx.globalAlpha=1;
if(p.life<=0){
particles.splice(index,1);
}
});
meteors.forEach((m,i)=>{
m.x+=m.vx;
m.y+=m.vy;
m.life--;
ctx.strokeStyle="white";
ctx.lineWidth=3;
ctx.beginPath();
ctx.moveTo(m.x,m.y);
ctx.lineTo(m.x-m.vx*5,m.y-m.vy*5);
ctx.stroke();
if(m.life<=0){
meteors.splice(i,1);
}
});
const ranking=[...enemies]
.sort((a,b)=>b.size-a.size);
const biggest=ranking[0];
enemies.forEach(e=>{
drawSnake(
e.body,
e.size,
e.color,
e.angle,
e===biggest
);
});
drawSnake(
player.body,
player.size,
player.color,
player.angle
);
ctx.setTransform(1,0,0,1,0,0);
mtx.fillStyle="black";
mtx.fillRect(0,0,220,220);
mtx.fillStyle="lime";
mtx.fillRect(
(player.x/world.width)*220,
(player.y/world.height)*220,
5,
5
);
mtx.fillStyle="red";
enemies.forEach(e=>{
mtx.fillRect(
(e.x/world.width)*220,
(e.y/world.height)*220,
2,
2
);
});
}
function updateUI(){
document.getElementById("score").innerText=Math.floor(score);
document.getElementById("size").innerText=Math.floor(player.size);
document.getElementById("lives").innerText=lives;
document.getElementById("level").innerText=level;
document.getElementById("combo").innerText=combo;
const ranking=[...enemies]
.sort((a,b)=>b.size-a.size)
.slice(0,5);
let html="";
ranking.forEach((e,i)=>{
html += `<div>${i+1}. ${e.name} (${Math.floor(e.size)})</div>`;
});
html += `<hr><div>YOU (${Math.floor(player.size)})</div>`;
document.getElementById("board").innerHTML=html;
}
function loop(){ if(gamePaused){ requestAnimationFrame(loop); return; }
if(lives>0){
movePlayer();
moveEnemies();
eatFood();
hitEnemy();
enemyCollisions();
playerKillsEnemies();
if(comboTimer>0){
comboTimer--;
}else{
combo=0;
}
draw();
updateUI();
}
requestAnimationFrame(loop);
}
loop();
window.addEventListener("keydown",e=>{
if(e.code==="Space"){
player.speed=7;
boostDrain=setInterval(()=>{
if(player.size>10){
player.size -= 0.15;
foods.push({
x:player.x-Math.cos(player.angle)*30,
y:player.y-Math.sin(player.angle)*30,
r:5,
glow:10,
points:5,
growth:0.02,
pulse:0,
color:player.color
});
spawnParticles(
player.x,
player.y,
player.color,
3
);
}
},40);
}
if(e.code==="ShiftLeft"){
player.speed=14;
spawnParticles(
player.x,
player.y,
"#ffffff",
40
);
setTimeout(()=>{
player.speed=4;
},300);
}
});
window.addEventListener("keyup",e=>{
if(e.code==="Space"){
player.speed=4;
clearInterval(boostDrain);
}
});
const base=document.getElementById("joystickBase");
const stick=document.getElementById("joystick");
let dragging=false;
base.addEventListener("touchstart",()=>dragging=true);
base.addEventListener("touchmove",move);
base.addEventListener("touchend",end);
base.addEventListener("mousedown",()=>dragging=true);
window.addEventListener("mousemove",move);
window.addEventListener("mouseup",end);
function move(e){
if(!dragging) return;
let rect=base.getBoundingClientRect();
let clientX=e.touches?e.touches[0].clientX:e.clientX;
let clientY=e.touches?e.touches[0].clientY:e.clientY;
let x=clientX-rect.left-70;
let y=clientY-rect.top-70;
let dist=Math.sqrt(x*x+y*y);
if(dist>45){
x=x/dist*45;
y=y/dist*45;
}
stick.style.left=(x+40)+"px";
stick.style.top=(y+40)+"px";
let target=Math.atan2(y,x);
player.angle += (target-player.angle)*0.15;
}
function end(){
dragging=false;
stick.style.left="40px";
stick.style.top="40px";
}
window.addEventListener("resize",()=>{
canvas.width=innerWidth;
canvas.height=innerHeight;
});
</script>
</body>
</html>
